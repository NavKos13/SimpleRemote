<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Rust Remote Test Pad</title>
        <style>
            body{font-family: sans-serif; background: #121212; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 90vh; }
            #trackpad { width: 90vw; height: 50vh; max-width: 400px; background: #1e1e1e; border: 2px solid #00e5ff; border-radius: 12px; display: flex; align-items: center; justify-content: center; user-select: none; touch-action: none; }
                    input { margin-top: 20px; padding: 12px; font-size: 16px; width: 80%; max-width: 360px; border-radius: 6px; border: none; }
        </style>
    </head>
    <body>
        <h2>
            Rust Remote Trackpad
        </h2>
        <div id="trackpad">Drag your finger here</div>
        <input type="text" id="keyboard" placeholder="Type here to test keyboard...">

        <script>
        // Connect to the WebSocket endpoint on the Rust server
        const ws = new WebSocket('ws://${window.location.host}/ws');
        let lastX = 0;
        let lastY = 0;

        const trackpad = document.getElementById('trackpad');

        trackpad.addEventListener('touchstart', (e) => {
          lastX = e.touches[0].clientX;
          lastY = e.touches[0].clientY;
        });

        trackpad.addEventListener('touchmove', (e) => {
          if (ws.readyState !== WebSocket.OPEN) return;

          const currentX = e.touches[0].clientX
          const currentY = e.touches[0].clientY

          // Calculate the relative change in motion (delta)
          const dx = currentX-lastX;
          const dy = currentY-lastY;

          // Send standart camelCase JSON structured payload
          ws.send(JSON.stringify({type: "mouseMove", dx: dx, dy: dy}));

          lastX = currentX;
          lastY = currentY;
        });

        // Capture keyboard strokes
        const keyboard = document.getElementById('keyboard');
        keyboard.addEventListener('input', (e) => {
          if (ws.readyState !== WebSocket.OPEN || !e.data) return;
          ws.send(JSON.stringify({type: "keyPress", key: e.data, direction:"Click"}));
          keyboard.value = ''; // Reset input box
        });
        </script>
    </body>
</html>
